<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;" />
  <title>VEShell</title>
  <link rel="stylesheet" href="../../node_modules/@xterm/xterm/css/xterm.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="terminal"></div>

  <!-- Right-click context menu -->
  <div id="context-menu" class="context-menu hidden" role="menu">
    <div class="ctx-item" data-action="copy" role="menuitem">Copy<span class="ctx-key">Ctrl+C</span></div>
    <div class="ctx-item" data-action="cut" role="menuitem">Cut<span class="ctx-key">Ctrl+Shift+X</span></div>
    <div class="ctx-item" data-action="paste" role="menuitem">Paste<span class="ctx-key">Ctrl+V</span></div>
    <div class="ctx-sep"></div>
    <div class="ctx-item" data-action="selectAll" role="menuitem">Select All<span class="ctx-key">Ctrl+Shift+A</span></div>
    <div class="ctx-sep"></div>
    <div class="ctx-item" data-action="claudewhat" role="menuitem">ClaudeWhat (explain selection)<span class="ctx-key">Ctrl+Shift+W</span></div>
    <div class="ctx-item" data-action="clear" role="menuitem">Clear<span class="ctx-key"></span></div>
    <div class="ctx-sep"></div>
    <div class="ctx-item" data-action="restart" role="menuitem">Restart Session<span class="ctx-key"></span></div>
  </div>

  <!-- ClaudeWhat: a VEShell-owned panel showing a contextual explanation of
       the selected snippet. The terminal stays untouched underneath. -->
  <div id="claudewhat" class="cw-panel hidden">
    <div class="cw-header">
      <span id="cw-title" class="cw-title">ClaudeWhat</span>
    </div>
    <div id="cw-body" class="cw-body" tabindex="0"></div>
    <div class="cw-toolbar">
      <button id="cw-pageup" class="cw-btn" title="Scroll up (PageUp)">Page Up</button>
      <button id="cw-pagedown" class="cw-btn" title="Scroll down (PageDown)">Page Down</button>
      <button id="cw-more" class="cw-btn" title="Ask for a deeper explanation">Explain More</button>
      <button id="cw-return" class="cw-btn cw-btn-primary" title="Close and return (Esc)">Return to project</button>
    </div>
  </div>

  <!-- Transient toast (Copied / Pasted / etc.) -->
  <div id="toast" class="toast hidden"></div>

  <!-- Session-ended overlay -->
  <div id="overlay" class="overlay hidden">
    <div class="overlay-box">
      <div id="overlay-msg">Session ended.</div>
      <button id="overlay-restart">Restart session</button>
      <div class="overlay-hint">Press Enter to restart</div>
    </div>
  </div>

  <script src="../../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="../../node_modules/@xterm/addon-web-links/lib/addon-web-links.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
